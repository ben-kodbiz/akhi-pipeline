# Akhi Data Builder - Docker Compose Configuration
# Phase 9: Production Dockerization

version: '3.8'

services:
  # Main CrewAI Application
  akhi-crewai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akhi-crewai-app
    ports:
      - "8000:8000"  # Main API
      - "8001:8001"  # Secondary API
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./deployments:/app/deployments
      - akhi-pipeline-data:/app/pipeline/db
    networks:
      - akhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis

  # Web Frontend
  akhi-frontend:
    build:
      context: ./frontend_web
      dockerfile: Dockerfile
    container_name: akhi-frontend-web
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - NODE_ENV=production
    networks:
      - akhi-network
    restart: unless-stopped
    depends_on:
      - akhi-crewai

  # Redis for caching and task queues
  redis:
    image: redis:7-alpine
    container_name: akhi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - akhi-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: akhi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - akhi-network
    restart: unless-stopped
    depends_on:
      - akhi-crewai
      - akhi-frontend

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: akhi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - akhi-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: akhi-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - akhi-network
    restart: unless-stopped
    profiles:
      - monitoring
    depends_on:
      - prometheus

volumes:
  akhi-pipeline-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  akhi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16