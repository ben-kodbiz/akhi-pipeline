# Akhi Data Builder - Development Docker Compose Configuration
# Phase 9: Production Dockerization

version: '3.8'

services:
  # Main CrewAI Application (Development)
  akhi-crewai-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: akhi-crewai-dev
    ports:
      - "8000:8000"
      - "8001:8001"
      - "5678:5678"  # Debug port
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=DEBUG
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEVELOPMENT=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./akhi_crewai:/app/akhi_crewai
      - ./pipeline:/app/pipeline
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./docs:/app/docs
    networks:
      - akhi-dev-network
    restart: unless-stopped
    command: >
      sh -c "pip install debugpy &&
             python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m akhi_crewai.main --api --debug"

  # Frontend Development Server
  akhi-frontend-dev:
    build:
      context: ./frontend_web
      dockerfile: Dockerfile.dev
    container_name: akhi-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend_web/src:/app/src
      - ./frontend_web/public:/app/public
      - /app/node_modules
    networks:
      - akhi-dev-network
    restart: unless-stopped
    command: npm run dev

  # Redis for development
  redis-dev:
    image: redis:7-alpine
    container_name: akhi-redis-dev
    ports:
      - "6379:6379"
    networks:
      - akhi-dev-network
    restart: unless-stopped

  # Database GUI (Redis Commander)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: akhi-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis-dev:6379
    networks:
      - akhi-dev-network
    restart: unless-stopped
    depends_on:
      - redis-dev

  # Jupyter Notebook for development
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: akhi-jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=akhi-dev-token
    volumes:
      - ./:/app
      - ./notebooks:/app/notebooks
    networks:
      - akhi-dev-network
    restart: unless-stopped
    command: >
      sh -c "pip install jupyter jupyterlab &&
             jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='akhi-dev-token'"

networks:
  akhi-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16