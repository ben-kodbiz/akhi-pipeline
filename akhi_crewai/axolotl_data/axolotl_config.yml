base_model: microsoft/DialoGPT-medium
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
load_in_8bit: false
load_in_4bit: true
strict: false
datasets:
- path: axolotl_data/train_dataset.jsonl
  type: conversation
val_set_size: 1
output_dir: axolotl_data/models
sequence_len: 2048
sample_packing: true
pad_to_sequence_len: true
adapter: qlora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
- q_proj
- v_proj
- k_proj
- o_proj
- gate_proj
- down_proj
- up_proj
gradient_accumulation_steps: 4
micro_batch_size: 4
num_epochs: 3
learning_rate: 0.0002
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
warmup_steps: 10
bf16: true
fp16: false
gradient_checkpointing: true
flash_attention: true
logging_steps: 1
saves_per_epoch: 1
evals_per_epoch: 4
wandb_project: akhi-islamic-ai-20250731
wandb_name: islamic-model-20250731-095327
special_tokens:
  bos_token: <s>
  eos_token: </s>
  unk_token: <unk>
  pad_token: <pad>
train_on_inputs: false
group_by_length: true
