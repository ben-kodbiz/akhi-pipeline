# CrewAI Agentic System Configuration

# YouTube Search Configuration
youtube:
  search:
    max_results: 50
    default_duration: "medium"  # short, medium, long
    quality_filter: "high"
    language: "en"
    region: "US"
  
  download:
    audio_format: "mp3"
    audio_quality: "192"
    output_dir: "data/audio"
    max_filesize: "500M"
    retry_attempts: 3
    timeout: 300

# Transcription Configuration
transcription:
  model_size: "base"  # tiny, base, small, medium, large
  device: "auto"  # auto, cpu, cuda
  language: "auto"  # auto or specific language code
  output_dir: "data/transcripts"
  include_timestamps: true
  word_timestamps: false

# Text Processing Configuration
text_processing:
  chunking:
    chunk_size: 1000
    chunk_overlap: 200
    separator: "\n\n"
    preserve_sentences: true
  
  embedding:
    model_name: "all-MiniLM-L6-v2"
    device: "auto"
    batch_size: 32
    normalize_embeddings: true

# FAISS Configuration
faiss:
  index_type: "IndexFlatIP"  # IndexFlatIP, IndexIVFFlat, IndexHNSWFlat
  dimension: 384  # Must match embedding model dimension
  nlist: 100  # For IVF indices
  nprobe: 10  # For IVF indices
  index_dir: "data/embeddings"
  metadata_file: "data/embeddings/metadata.jsonl"

# Local LLM Configuration (GGUF Model)
llm:
  model_path: "models/Qwen3-1.7B.Q4_K_M.gguf"  # Updated to use downloaded model
  context_length: 4096
  max_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  repeat_penalty: 1.1
  n_gpu_layers: 0  # Set to -1 for full GPU offload

# Local LLM Configuration for CrewAI agents
# Uses HTTP API for CrewAI compatibility
local_llm:
  provider: "http_api"
  model_name: "local/Qwen3-1.7B.Q4_K_M.gguf"
  base_url: "http://localhost:8000/v1"  # Local HTTP API endpoint
  api_key: null
  temperature: 0.7
  max_tokens: 2048

# CrewAI Agent Configuration
agents:
  video_researcher:
    role: "YouTube Research Assistant"
    goal: "Find relevant Islamic YouTube videos based on topics and keywords"
    backstory: "You are an expert Islamic content researcher with deep knowledge of Islamic scholars, topics, and YouTube content. You excel at finding high-quality educational videos."
    max_iter: 5
    max_execution_time: 300
    verbose: true
    allow_delegation: false
  
  transcriber:
    role: "Audio-to-Text Transcriber"
    goal: "Download and transcribe YouTube videos with high accuracy"
    backstory: "You are a professional audio processing specialist with expertise in speech recognition and transcription. You ensure accurate and clean transcripts."
    max_iter: 3
    max_execution_time: 600
    verbose: true
    allow_delegation: false
  
  vector_indexer:
    role: "Embedding Engineer"
    goal: "Process transcripts into searchable vector embeddings for semantic retrieval"
    backstory: "You are a vector database specialist with expertise in semantic search and information retrieval. You create efficient and accurate search indices."
    max_iter: 3
    max_execution_time: 300
    verbose: true
    allow_delegation: false
  
  content_qa:
    role: "Semantic Retriever and Islamic Knowledge Assistant"
    goal: "Answer questions and provide summaries using Islamic video content with accuracy and context"
    backstory: "You are an Islamic knowledge specialist with expertise in retrieval-augmented generation. You provide accurate, contextual answers based on Islamic teachings."
    max_iter: 5
    max_execution_time: 180
    verbose: true
    allow_delegation: false

# Crew Configuration
crew:
  process: "sequential"  # sequential, hierarchical
  verbose: true
  memory: true
  cache: true
  max_rpm: 10
  share_crew: false

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "outputs/crew.log"
  max_size: "10MB"
  backup_count: 5

# Output Configuration
output:
  base_dir: "outputs"
  reports_dir: "outputs/reports"
  results_dir: "outputs/results"
  format: "json"  # json, yaml, txt
  include_metadata: true
  timestamp_format: "%Y%m%d_%H%M%S"

# Performance Configuration
performance:
  parallel_downloads: 3
  parallel_transcriptions: 2
  batch_embedding_size: 100
  cache_embeddings: true
  cleanup_temp_files: true

# QLoRA Training Configuration (Phase 8)
qlora_training:
  enabled: true
  config_file: "config/qlora_config.yaml"
  model_output_dir: "models/akhi_qlora"
  training_data_dir: "data/qlora_training"
  
  # Training parameters
  training:
    epochs: 3
    batch_size: 4
    learning_rate: 0.0002
    max_sequence_length: 512
    gradient_accumulation_steps: 4
    warmup_steps: 100
    
  # LoRA parameters
  lora:
    rank: 16
    alpha: 32
    dropout: 0.1
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    
  # Quantization settings
  quantization:
    load_in_4bit: true
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_use_double_quant: true
    bnb_4bit_quant_type: "nf4"
    
  # Validation settings
  validation:
    val_set_size: 0.1
    eval_steps: 50
    save_steps: 100
    early_stopping_patience: 3
    
  # Islamic content validation
  islamic_validation:
    enable_content_filtering: true
    require_islamic_context: true
    check_accuracy: true
    sample_prompts:
      - "What are the five pillars of Islam?"
      - "Explain the importance of prayer in Islam."
      - "What is the concept of Tawhid?"
      - "Describe the significance of Ramadan."
      
# Model Deployment Configuration
model_deployment:
  enabled: true
  default_port: 8000
  default_max_length: 512
  default_temperature: 0.7
  
  # Deployment targets
  targets:
    local:
      enabled: true
      create_inference_script: true
      create_readme: true
      
    api_server:
      enabled: true
      port: 8000
      enable_auth: true
      create_docs: true
      
    # Docker configuration removed - focusing on functionality and testing
      
    huggingface:
      enabled: false
      create_model_card: true
      auto_upload: false
      
  # Security settings
  security:
    enable_authentication: true
    jwt_secret_key: "change-this-in-production"
    token_expire_minutes: 30
    
  # Monitoring
  monitoring:
    enable_logging: true
    log_level: "INFO"
    track_performance: true
    health_check_endpoint: true

# Islamic Content Specific
islamic_content:
  preferred_scholars:
    - "Nouman Ali Khan"
    - "Yasir Qadhi"
    - "Omar Suleiman"
    - "Mufti Menk"
    - "Abdur Raheem Green"
  
  topics:
    - "Quran"
    - "Hadith"
    - "Seerah"
    - "Fiqh"
    - "Aqeedah"
    - "Islamic History"
    - "Tafseer"
    - "Islamic Ethics"
  
  content_filters:
    - "Islamic"
    - "Muslim"
    - "Quran"
    - "Prophet"
    - "Allah"
    - "Islam"