# Agent Coordinator Configuration
# This file configures the enhanced agent coordination framework

coordinator:
  max_concurrent_tasks: 10
  default_task_timeout: 300  # 5 minutes
  health_check_interval: 60  # 1 minute
  performance_monitoring: true
  auto_recovery: true
  load_balancing: true
  resource_optimization: true
  
  # Coordination strategies
  strategies:
    default: 'adaptive'
    fallback: 'sequential'
    optimization_enabled: true
    
    # Strategy-specific settings
    adaptive:
      cpu_threshold: 70  # Switch to sequential if CPU > 70%
      memory_threshold: 80  # Switch to sequential if memory > 80%
      task_count_threshold: 5  # Use pipeline if > 5 tasks
    
    parallel:
      max_parallel_tasks: 8
      resource_balancing: true
      failure_tolerance: 0.2  # Allow 20% task failures
    
    pipeline:
      stage_overlap: true
      buffer_size: 2
      backpressure_handling: true
    
    sequential:
      fail_fast: true
      checkpoint_interval: 3  # Save state every 3 tasks

# Resource management
resources:
  cpu_cores: 8  # Auto-detected if not specified
  memory_gb: 16  # Auto-detected if not specified
  gpu_available: true
  gpu_memory_gb: 8
  
  # Resource allocation policies
  allocation:
    strategy: 'fair_share'  # fair_share, priority_based, adaptive
    reserve_percentage: 20  # Reserve 20% for system
    overcommit_ratio: 1.2   # Allow 120% allocation
  
  # Resource monitoring
  monitoring:
    enabled: true
    interval: 30  # seconds
    alert_thresholds:
      cpu_usage: 85
      memory_usage: 90
      gpu_usage: 95
      disk_usage: 80

# Agent configurations
agents:
  video_researcher:
    enabled: true
    max_concurrent_tasks: 2
    priority: 1
    capabilities:
      - 'search'
      - 'research'
      - 'content_discovery'
    tools:
      - 'youtube_search'
    resource_requirements:
      cpu_cores: 1.0
      memory_mb: 512
    performance_targets:
      avg_task_duration: 30.0  # seconds
      success_rate: 0.95
    health_check:
      enabled: true
      interval: 120  # seconds
      timeout: 10
    
  transcriber:
    enabled: true
    max_concurrent_tasks: 1
    priority: 2
    capabilities:
      - 'transcription'
      - 'audio_processing'
      - 'speech_recognition'
    tools:
      - 'transcriber'
    resource_requirements:
      cpu_cores: 2.0
      memory_mb: 2048
      gpu_memory_mb: 1024
    performance_targets:
      avg_task_duration: 300.0  # 5 minutes
      success_rate: 0.90
    health_check:
      enabled: true
      interval: 180  # seconds
      timeout: 15
    
  vector_indexer:
    enabled: true
    max_concurrent_tasks: 3
    priority: 3
    capabilities:
      - 'embedding'
      - 'indexing'
      - 'storage'
      - 'vector_operations'
    tools:
      - 'chunker'
      - 'embedder'
      - 'faiss_store'
    resource_requirements:
      cpu_cores: 1.5
      memory_mb: 1024
      gpu_memory_mb: 512
    performance_targets:
      avg_task_duration: 120.0  # 2 minutes
      success_rate: 0.98
    health_check:
      enabled: true
      interval: 90  # seconds
      timeout: 12
    
  content_qa:
    enabled: true
    max_concurrent_tasks: 2
    priority: 4
    capabilities:
      - 'query'
      - 'generation'
      - 'qa'
      - 'summarization'
    tools:
      - 'faiss_query'
      - 'summarizer'
      - 'answer_generator'
    resource_requirements:
      cpu_cores: 1.0
      memory_mb: 1024
      gpu_memory_mb: 1024
    performance_targets:
      avg_task_duration: 45.0  # seconds
      success_rate: 0.95
    health_check:
      enabled: true
      interval: 60  # seconds
      timeout: 8

# Task management
tasks:
  # Default task settings
  defaults:
    priority: 1
    max_retries: 3
    timeout: 300  # 5 minutes
    retry_delay: 5  # seconds
    exponential_backoff: true
    
  # Task categories and their settings
  categories:
    search:
      priority: 1
      timeout: 60
      max_retries: 2
      resource_weight: 0.5
    
    download:
      priority: 2
      timeout: 600  # 10 minutes
      max_retries: 3
      resource_weight: 1.0
    
    transcription:
      priority: 3
      timeout: 1200  # 20 minutes
      max_retries: 2
      resource_weight: 2.0
    
    processing:
      priority: 4
      timeout: 300
      max_retries: 3
      resource_weight: 1.0
    
    embedding:
      priority: 5
      timeout: 600
      max_retries: 2
      resource_weight: 1.5
    
    storage:
      priority: 6
      timeout: 180
      max_retries: 3
      resource_weight: 0.8
    
    query:
      priority: 7
      timeout: 30
      max_retries: 2
      resource_weight: 0.3
    
    generation:
      priority: 8
      timeout: 120
      max_retries: 2
      resource_weight: 1.2
  
  # Task scheduling
  scheduling:
    algorithm: 'priority_queue'  # priority_queue, round_robin, fair_share
    preemption: false
    aging_factor: 1.1  # Increase priority over time
    starvation_prevention: true
    
  # Task dependencies
  dependency_management:
    enabled: true
    circular_detection: true
    auto_resolution: true
    timeout_propagation: true

# Communication and messaging
communication:
  # Inter-agent communication
  messaging:
    enabled: true
    protocol: 'async'  # async, sync, hybrid
    queue_size: 1000
    message_timeout: 30
    
  # Event system
  events:
    enabled: true
    event_types:
      - 'task_started'
      - 'task_completed'
      - 'task_failed'
      - 'agent_status_changed'
      - 'resource_alert'
      - 'performance_threshold'
    
    # Event handlers
    handlers:
      task_failed:
        - 'log_error'
        - 'notify_admin'
        - 'trigger_recovery'
      
      resource_alert:
        - 'log_warning'
        - 'adjust_scheduling'
        - 'scale_resources'
      
      performance_threshold:
        - 'log_metric'
        - 'optimize_allocation'

# Monitoring and observability
monitoring:
  enabled: true
  
  # Metrics collection
  metrics:
    collection_interval: 30  # seconds
    retention_period: 7  # days
    aggregation_window: 300  # 5 minutes
    
    # Metric types
    types:
      - 'task_duration'
      - 'task_success_rate'
      - 'agent_utilization'
      - 'resource_usage'
      - 'queue_length'
      - 'throughput'
      - 'latency'
      - 'error_rate'
  
  # Performance tracking
  performance:
    enabled: true
    baseline_period: 24  # hours
    anomaly_detection: true
    trend_analysis: true
    
    # Performance thresholds
    thresholds:
      task_duration_multiplier: 2.0
      success_rate_minimum: 0.85
      agent_utilization_maximum: 0.90
      queue_length_maximum: 50
  
  # Health monitoring
  health:
    enabled: true
    check_interval: 60  # seconds
    timeout: 10  # seconds
    
    # Health indicators
    indicators:
      - 'agent_responsiveness'
      - 'task_completion_rate'
      - 'resource_availability'
      - 'system_load'
      - 'error_frequency'

# Error handling and recovery
error_handling:
  enabled: true
  
  # Error classification
  classification:
    transient_errors:
      - 'network_timeout'
      - 'temporary_resource_unavailable'
      - 'rate_limit_exceeded'
    
    permanent_errors:
      - 'invalid_input'
      - 'authentication_failed'
      - 'resource_not_found'
    
    critical_errors:
      - 'system_failure'
      - 'data_corruption'
      - 'security_breach'
  
  # Recovery strategies
  recovery:
    auto_retry:
      enabled: true
      max_attempts: 3
      backoff_strategy: 'exponential'
      base_delay: 1.0  # seconds
      max_delay: 60.0  # seconds
    
    failover:
      enabled: true
      backup_agents: true
      graceful_degradation: true
    
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      timeout: 60  # seconds
      half_open_max_calls: 3

# Security and compliance
security:
  authentication:
    enabled: false  # Enable for production
    method: 'token'  # token, certificate, oauth
  
  authorization:
    enabled: false  # Enable for production
    rbac: true  # Role-based access control
  
  encryption:
    in_transit: false  # Enable for production
    at_rest: false    # Enable for production
  
  audit:
    enabled: true
    log_all_operations: true
    retention_period: 30  # days

# Logging configuration
logging:
  level: 'INFO'
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  
  # File logging
  file:
    enabled: true
    log_file: './logs/coordinator.log'
    max_file_size: 10  # MB
    backup_count: 5
    rotation: 'time'  # time, size
  
  # Structured logging
  structured:
    enabled: true
    format: 'json'
    include_context: true
  
  # Component-specific logging
  components:
    scheduler:
      level: 'DEBUG'
      separate_file: true
    
    resource_manager:
      level: 'INFO'
      separate_file: true
    
    agents:
      level: 'INFO'
      separate_file: false

# Development and testing
development:
  debug_mode: false
  test_mode: false
  mock_agents: false
  simulation_mode: false
  
  # Development tools
  profiling:
    enabled: false
    output_dir: './profiles'
  
  tracing:
    enabled: false
    trace_all_operations: false

# Integration settings
integration:
  # CrewAI integration
  crewai:
    auto_register_agents: true
    validate_compatibility: true
    use_native_tools: true
  
  # External systems
  external:
    webhooks:
      enabled: false
      endpoints: []
    
    apis:
      rate_limiting: true
      timeout: 30  # seconds
    
    databases:
      connection_pooling: true
      max_connections: 10

# Backup and disaster recovery
backup:
  enabled: true
  
  # Backup schedule
  schedule:
    frequency: 'hourly'  # hourly, daily, weekly
    retention: 7  # days
  
  # Backup content
  content:
    - 'agent_states'
    - 'task_history'
    - 'performance_metrics'
    - 'configuration'
  
  # Backup location
  location:
    type: 'local'  # local, s3, gcs
    path: './backups/coordinator'
  
  # Recovery settings
  recovery:
    auto_recovery: true
    recovery_timeout: 300  # 5 minutes
    validate_recovery: true

# Notifications and alerting
notifications:
  enabled: true
  
  # Notification channels
  channels:
    email:
      enabled: false
      smtp_server: ''
      recipients: []
    
    slack:
      enabled: false
      webhook_url: ''
      channel: '#alerts'
    
    webhook:
      enabled: false
      url: ''
      headers: {}
  
  # Alert rules
  alerts:
    high_error_rate:
      threshold: 0.1  # 10%
      window: 300  # 5 minutes
      severity: 'warning'
    
    resource_exhaustion:
      threshold: 0.95  # 95%
      window: 60  # 1 minute
      severity: 'critical'
    
    agent_failure:
      threshold: 1  # any failure
      window: 0  # immediate
      severity: 'error'
    
    performance_degradation:
      threshold: 2.0  # 2x slower than baseline
      window: 600  # 10 minutes
      severity: 'warning'