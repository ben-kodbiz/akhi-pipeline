# Enhanced Islamic Content Crew Configuration
# This configuration defines the enhanced crew setup with framework integration

crew:
  name: "Enhanced Islamic Content Crew"
  version: "2.0.0"
  description: "Enhanced crew for Islamic educational content processing with framework integration"
  max_concurrent_workflows: 3
  enable_performance_monitoring: true
  enable_error_recovery: true
  enable_auto_scaling: true
  health_check_interval: 30  # seconds
  metrics_collection_interval: 60  # seconds

# Workflow definitions
workflows:
  full_pipeline:
    description: "Complete video processing pipeline from search to indexing"
    enabled: true
    max_concurrent_executions: 2
    timeout: 3600  # 1 hour
    retry_policy:
      max_retries: 3
      backoff_strategy: "exponential"
      base_delay: 5  # seconds
    steps:
      - search_videos
      - download_video
      - transcribe_audio
      - chunk_text
      - generate_embeddings
      - store_vectors
      - setup_query_system
    
  qa_pipeline:
    description: "Question answering pipeline using indexed content"
    enabled: true
    max_concurrent_executions: 5
    timeout: 300  # 5 minutes
    retry_policy:
      max_retries: 2
      backoff_strategy: "linear"
      base_delay: 2  # seconds
    steps:
      - query_vectors
      - generate_summary
      - generate_answer
    
  content_analysis:
    description: "Content analysis and insight generation"
    enabled: true
    max_concurrent_executions: 3
    timeout: 600  # 10 minutes
    retry_policy:
      max_retries: 2
      backoff_strategy: "exponential"
      base_delay: 3  # seconds
    steps:
      - query_vectors
      - analyze_content
      - generate_insights
    
  batch_processing:
    description: "Batch processing of multiple videos"
    enabled: true
    max_concurrent_executions: 1
    timeout: 7200  # 2 hours
    retry_policy:
      max_retries: 1
      backoff_strategy: "none"
    steps:
      - batch_search
      - batch_download
      - batch_transcribe
      - batch_index

# Agent configurations
agents:
  video_researcher:
    enabled: true
    max_concurrent_tasks: 2
    timeout: 300  # 5 minutes per task
    memory_limit: "1GB"
    cpu_limit: 2
    tools:
      - youtube_search
      - youtube_downloader
    capabilities:
      - search
      - research
      - download
      - content_discovery
    performance_targets:
      response_time: 30  # seconds
      success_rate: 0.95
      throughput: 10  # tasks per hour
    error_handling:
      max_retries: 3
      retry_delay: 5  # seconds
      fallback_strategy: "skip_and_continue"
    
  transcriber:
    enabled: true
    max_concurrent_tasks: 1
    timeout: 1800  # 30 minutes per task
    memory_limit: "4GB"
    cpu_limit: 4
    gpu_enabled: true
    tools:
      - transcriber
    capabilities:
      - transcription
      - audio_processing
      - speech_recognition
    performance_targets:
      response_time: 300  # seconds
      success_rate: 0.98
      throughput: 2  # tasks per hour
    error_handling:
      max_retries: 2
      retry_delay: 10  # seconds
      fallback_strategy: "use_backup_model"
    
  vector_indexer:
    enabled: true
    max_concurrent_tasks: 2
    timeout: 600  # 10 minutes per task
    memory_limit: "2GB"
    cpu_limit: 3
    tools:
      - chunker
      - embedder
      - faiss_store
    capabilities:
      - embedding
      - indexing
      - storage
      - vector_operations
    performance_targets:
      response_time: 120  # seconds
      success_rate: 0.99
      throughput: 5  # tasks per hour
    error_handling:
      max_retries: 3
      retry_delay: 5  # seconds
      fallback_strategy: "reduce_batch_size"
    
  content_qa:
    enabled: true
    max_concurrent_tasks: 3
    timeout: 180  # 3 minutes per task
    memory_limit: "1.5GB"
    cpu_limit: 2
    tools:
      - faiss_query
      - summarizer
      - answer_generator
    capabilities:
      - query
      - generation
      - qa
      - summarization
      - reasoning
    performance_targets:
      response_time: 15  # seconds
      success_rate: 0.97
      throughput: 20  # tasks per hour
    error_handling:
      max_retries: 2
      retry_delay: 3  # seconds
      fallback_strategy: "use_cached_response"

# Tool-specific configurations for enhanced integration
tools:
  youtube_search:
    enabled: true
    priority: 1
    cache_enabled: true
    cache_ttl: 3600  # 1 hour
    rate_limit:
      requests_per_minute: 60
      burst_limit: 10
    
  youtube_downloader:
    enabled: true
    priority: 1
    max_file_size: "500MB"
    quality_preference: "best_audio"
    cleanup_after: true
    
  transcriber:
    enabled: true
    priority: 2
    model_size: "base"
    language: "auto"
    enable_vad: true
    chunk_length: 30  # seconds
    
  chunker:
    enabled: true
    priority: 1
    chunk_size: 1000
    chunk_overlap: 200
    semantic_chunking: true
    
  embedder:
    enabled: true
    priority: 2
    model_name: "sentence-transformers/all-MiniLM-L6-v2"
    batch_size: 32
    normalize_embeddings: true
    
  faiss_store:
    enabled: true
    priority: 2
    index_type: "IVF"
    nlist: 100
    enable_compression: true
    
  faiss_query:
    enabled: true
    priority: 1
    default_k: 5
    search_type: "similarity"
    enable_reranking: true
    
  summarizer:
    enabled: true
    priority: 1
    max_length: 500
    strategy: "hybrid"
    preserve_islamic_terms: true
    
  answer_generator:
    enabled: true
    priority: 1
    max_answer_length: 1000
    include_citations: true
    islamic_context_aware: true

# Performance and monitoring
performance:
  monitoring:
    enabled: true
    metrics_retention: 7  # days
    alert_thresholds:
      response_time: 60  # seconds
      error_rate: 0.05  # 5%
      memory_usage: 0.8  # 80%
      cpu_usage: 0.8  # 80%
  
  optimization:
    auto_scaling: true
    load_balancing: true
    resource_pooling: true
    cache_optimization: true
  
  reporting:
    daily_reports: true
    weekly_summaries: true
    performance_dashboards: true

# Error handling and recovery
error_handling:
  global_retry_policy:
    max_retries: 3
    backoff_strategy: "exponential"
    base_delay: 2  # seconds
    max_delay: 60  # seconds
  
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60  # seconds
    half_open_max_calls: 3
  
  fallback_strategies:
    tool_failure: "use_alternative_tool"
    agent_failure: "reassign_task"
    workflow_failure: "partial_completion"
  
  logging:
    level: "INFO"
    format: "structured"
    retention: 30  # days
    error_tracking: true

# Security and compliance
security:
  authentication:
    enabled: false  # For local development
    method: "api_key"
  
  authorization:
    enabled: false  # For local development
    rbac: false
  
  data_protection:
    encryption_at_rest: false  # For local development
    encryption_in_transit: false  # For local development
    data_anonymization: false
  
  audit_logging:
    enabled: true
    include_sensitive_data: false
    retention: 90  # days

# Integration settings
integration:
  crewai:
    version: "latest"
    custom_tools_enabled: true
    agent_memory_enabled: true
    task_delegation_enabled: true
  
  external_apis:
    youtube_api:
      enabled: true
      rate_limiting: true
    
    openai_api:
      enabled: false  # Using local models
      fallback_enabled: true
  
  storage:
    local_storage:
      enabled: true
      base_path: "./data"
      cleanup_policy: "manual"
    
    cloud_storage:
      enabled: false
      provider: "aws_s3"
      backup_enabled: false

# Development and testing
development:
  debug_mode: true
  verbose_logging: true
  test_mode: false
  mock_external_apis: false
  
  testing:
    unit_tests: true
    integration_tests: true
    performance_tests: false
    load_tests: false
  
  profiling:
    enabled: false
    memory_profiling: false
    cpu_profiling: false
    io_profiling: false

# Backup and disaster recovery
backup:
  enabled: false  # For local development
  frequency: "daily"
  retention: 30  # days
  compression: true
  
  disaster_recovery:
    enabled: false
    rpo: 24  # hours
    rto: 4   # hours
    backup_locations: 2

# Notification and alerting
notifications:
  enabled: false  # For local development
  channels:
    email: false
    slack: false
    webhook: false
  
  alert_rules:
    critical_errors: true
    performance_degradation: true
    resource_exhaustion: true
    workflow_failures: true

# Resource management
resources:
  global_limits:
    max_memory: "8GB"
    max_cpu: 8
    max_storage: "100GB"
    max_concurrent_workflows: 5
  
  allocation_strategy: "balanced"
  resource_monitoring: true
  auto_cleanup: true
  
  quotas:
    per_workflow: "1GB"
    per_agent: "2GB"
    per_tool: "500MB"